<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AZIFUKA PET SHOP</title>

    <!-- Bootstrap -->
    <link href="css/bootstrap.min.css" rel="stylesheet">
    
    <style>
      .navbar-brand {
        font-weight: bold;
      }
      .panel-pet {
        margin-bottom: 20px;
      }
      .panel-title {
        font-weight: bold;
      }
      .btn-buy {
        background-color: #4CAF50;
        color: white;
      }
      .btn-buy:hover {
        background-color: #45a049;
      }
    </style>
  </head>
  <body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-default">
      <div class="container">
        <div class="navbar-header">
          <a class="navbar-brand" href="#">AZIFUKA PET SHOP</a>
        </div>
        <div class="collapse navbar-collapse">
          <ul class="nav navbar-nav navbar-right">
            <li><a href="login.html">Login</a></li>
            <li><a href="aboutus.html">About Us</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container">
      <div class="row">
        <div class="col-xs-12 col-sm-8 col-sm-push-2">
          <h1 class="text-center">AZIFUKA PET SHOP</h1>
          <hr/>
          <br/>
        </div>
      </div>

      <div id="petsRow" class="row">
        <!-- PETS WILL LOAD HERE -->
      </div>
    </div>

    <!-- Pet Template (hidden) -->
    <div id="petTemplate" style="display: none;">
      <div class="col-sm-6 col-md-4 col-lg-3">
        <div class="panel panel-default panel-pet">
          <div class="panel-heading">
            <h3 class="panel-title">Pet Name</h3>
          </div>
          <div class="panel-body">
            <img alt="Pet Image" class="img-rounded img-center" style="width: 100%;" src="">
            <br/><br/>
            <strong>Breed</strong>: <span class="pet-breed">Breed Name</span><br/>
            <strong>Price</strong>: $<span class="pet-price">500</span><br/>
            <strong>Location</strong>: <span class="pet-location">City, Nigeria</span><br/><br/>
            <button class="btn btn-buy btn-block" type="button" data-id="0">Buy</button>
          </div>
        </div>
      </div>
    </div>

    <!-- jQuery and Bootstrap JS -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    
    <!-- App JS to load pets -->
    <script>
      $(document).ready(function() {
        // Sample pet data (in a real app, this would come from a database)
        const pets = [
          {
            name: "EMEKA",
            breed: "Scottish Terrier",
            price: "500",
            location: "Lagos, Nigeria",
            image: "images/scottish-terrier.jpeg"
          },
          {
            name: "GUT",
            breed: "Scottish Terrier",
            price: "500",
            location: "Abuja, Nigeria",
            image: "images/scottish-terrier.jpeg"
          },
          {
            name: "CHIDI",
            breed: "French Bulldog",
            price: "500",
            location: "Port Harcourt, Nigeria",
            image: "images/french-bulldog.jpeg"
          },
          {
            name: "AVOMIDE",
            breed: "Boxer",
            price: "500",
            location: "Ibadan, Nigeria",
            image: "images/boxer.jpeg"
          }
        ];

        // Load pets into the page
        const petTemplate = $('#petTemplate').html();
        const petsRow = $('#petsRow');
        
        pets.forEach((pet, index) => {
          const petElement = $(petTemplate);
          petElement.find('.panel-title').text(pet.name);
          petElement.find('img').attr('src', pet.image);
          petElement.find('.pet-breed').text(pet.breed);
          petElement.find('.pet-price').text(pet.price);
          petElement.find('.pet-location').text(pet.location);
          petElement.find('.btn-buy').attr('data-id', index);
          petElement.find('.btn-buy').click(function() {
            window.location.href = "buy.html?id=" + index;
          });
          petsRow.append(petElement);
        });
      });
    </script>
  </body>
</html>
